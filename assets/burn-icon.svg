<!-- App icon: the bare mark on the standard rounded-square canvas. 22% corner radius,
     mark at 57.3% of the canvas, per the Turn 8 spec. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="canvas" x1="0.28" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#1c1a12"/>
      <stop offset="1" stop-color="#100f0b"/>
    </linearGradient>
    <linearGradient id="topHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf7a"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="225" ry="225" fill="url(#canvas)"/>
  <rect width="1024" height="1024" rx="225" ry="225" fill="url(#vignette)"/>
  <rect width="1024" height="1024" rx="225" ry="225" fill="url(#topHighlight)"/>

  <!-- 22-unit mark scaled to 587px. Centred on the artwork rather than on its viewBox: the
       path sits left of centre in the source, which reads as a misaligned icon at Dock size. -->
  <g transform="translate(305.2 215.8) scale(26.6818)">
    <path fill="url(#flame)" d="M11.2 1.2c1 2.2-.2 3.6-1.3 4.9-1.2 1.4-2.3 2.7-1.5 4.8.3-1 .9-1.6 1.6-2 .1 1.4.9 2.1 1.7 2.9 1 1 1.9 2.1 1.9 3.9 0 3.1-2.6 5.3-5.8 5.3S1.9 18 1.9 14.9c0-3.6 2.3-5.9 4.4-8.2C8.4 4.6 10.1 2.9 11.2 1.2z"/>
    <path fill="#1a1710" opacity="0.3" d="M11 13.4c.5 1.6-.2 2.6-1.1 3.4-.5.4-.2 1.2.5 1.2 1.6 0 2.9-1.2 2.9-2.7 0-1-.7-1.6-2.3-1.9z"/>
  </g>
</svg>
